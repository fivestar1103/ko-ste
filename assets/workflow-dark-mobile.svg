<svg xmlns="http://www.w3.org/2000/svg" width="720" height="1080" viewBox="0 0 720 1080" role="img"><title>ko-ste — 의미 보존, 필요한 수정, 원문 대조</title><rect width="720" height="1080" fill="#0d1116"/><text x="48" y="56" font-size="18" font-weight="400" fill="#97a2ae" font-family="IBM Plex Mono, sans-serif">HOW KO-STE WORKS</text><path d="M48 108L672 108" stroke="#242c36" stroke-width="2" fill="none"/><text x="48" y="158" font-size="24" font-weight="500" fill="#79bdd6" font-family="IBM Plex Mono, sans-serif">01</text><text x="48" y="211" font-size="39" font-weight="500" fill="#e8ecf1" font-family="IBM Plex Sans KR, sans-serif">보존할 뜻을 확인</text><text x="48" y="266" font-size="29" font-weight="400" fill="#97a2ae" font-family="IBM Plex Sans KR, sans-serif">사실 · 조건 · 수치</text><text x="48" y="309" font-size="29" font-weight="400" fill="#97a2ae" font-family="IBM Plex Sans KR, sans-serif">확신 · 의무 · 코드</text><path d="M48 382L672 382" stroke="#242c36" stroke-width="2" fill="none"/><text x="48" y="432" font-size="24" font-weight="500" fill="#79bdd6" font-family="IBM Plex Mono, sans-serif">02</text><text x="48" y="485" font-size="39" font-weight="500" fill="#e8ecf1" font-family="IBM Plex Sans KR, sans-serif">필요한 부분만 수정</text><text x="48" y="540" font-size="29" font-weight="400" fill="#97a2ae" font-family="IBM Plex Sans KR, sans-serif">이미 잘 읽히는 문장은</text><text x="48" y="583" font-size="29" font-weight="400" fill="#97a2ae" font-family="IBM Plex Sans KR, sans-serif">그대로 둡니다.</text><path d="M48 656L672 656" stroke="#242c36" stroke-width="2" fill="none"/><text x="48" y="706" font-size="24" font-weight="500" fill="#79bdd6" font-family="IBM Plex Mono, sans-serif">03</text><text x="48" y="759" font-size="39" font-weight="500" fill="#e8ecf1" font-family="IBM Plex Sans KR, sans-serif">원문과 다시 대조</text><text x="48" y="814" font-size="29" font-weight="400" fill="#97a2ae" font-family="IBM Plex Sans KR, sans-serif">더한 뜻과 빠진 조건이</text><text x="48" y="857" font-size="29" font-weight="400" fill="#97a2ae" font-family="IBM Plex Sans KR, sans-serif">없는지 확인합니다.</text><rect x="48" y="954" width="4" height="52" fill="#79bdd6"/><text x="70" y="975" font-size="26" font-weight="400" fill="#97a2ae" font-family="IBM Plex Sans KR, sans-serif">해석이 갈리면 원문을 유지하고</text><text x="70" y="1007" font-size="26" font-weight="400" fill="#97a2ae" font-family="IBM Plex Sans KR, sans-serif">확인할 내용을 덧붙입니다.</text></svg>
