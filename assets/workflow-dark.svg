<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="460" viewBox="0 0 1600 460" role="img"><title>ko-ste — 의미 보존, 필요한 수정, 원문 대조</title><rect width="1600" height="460" fill="#0d1116"/><text x="72" y="56" font-size="18" font-weight="400" fill="#97a2ae" font-family="IBM Plex Mono, sans-serif">HOW KO-STE WORKS</text><path d="M72 116L522 116" stroke="#242c36" stroke-width="2" fill="none"/><text x="72" y="166" font-size="24" font-weight="500" fill="#79bdd6" font-family="IBM Plex Mono, sans-serif">01</text><text x="72" y="219" font-size="36" font-weight="500" fill="#e8ecf1" font-family="IBM Plex Sans KR, sans-serif">보존할 뜻을 확인</text><text x="72" y="274" font-size="26" font-weight="400" fill="#97a2ae" font-family="IBM Plex Sans KR, sans-serif">사실 · 조건 · 수치</text><text x="72" y="317" font-size="26" font-weight="400" fill="#97a2ae" font-family="IBM Plex Sans KR, sans-serif">확신 · 의무 · 코드</text><path d="M533 243L556 243" stroke="#626d7a" stroke-width="2" fill="none"/><path d="M550 237l6 6-6 6" stroke="#626d7a" fill="none" stroke-width="2"/><path d="M588 116L1038 116" stroke="#242c36" stroke-width="2" fill="none"/><text x="588" y="166" font-size="24" font-weight="500" fill="#79bdd6" font-family="IBM Plex Mono, sans-serif">02</text><text x="588" y="219" font-size="36" font-weight="500" fill="#e8ecf1" font-family="IBM Plex Sans KR, sans-serif">필요한 부분만 수정</text><text x="588" y="274" font-size="26" font-weight="400" fill="#97a2ae" font-family="IBM Plex Sans KR, sans-serif">이미 잘 읽히는 문장은</text><text x="588" y="317" font-size="26" font-weight="400" fill="#97a2ae" font-family="IBM Plex Sans KR, sans-serif">그대로 둡니다.</text><path d="M1049 243L1072 243" stroke="#626d7a" stroke-width="2" fill="none"/><path d="M1066 237l6 6-6 6" stroke="#626d7a" fill="none" stroke-width="2"/><path d="M1104 116L1554 116" stroke="#242c36" stroke-width="2" fill="none"/><text x="1104" y="166" font-size="24" font-weight="500" fill="#79bdd6" font-family="IBM Plex Mono, sans-serif">03</text><text x="1104" y=