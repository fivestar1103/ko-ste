<svg xmlns="http://www.w3.org/2000/svg" width="720" height="930" viewBox="0 0 720 930" role="img"><title>ko-ste — 뜻은 그대로. 읽기는 쉽게.</title><rect width="720" height="930" fill="#f2f4f7"/><text x="48" y="60" font-size="18" font-weight="400" fill="#55606d" font-family="IBM Plex Mono, sans-serif">KOREAN / WRITING / AGENT SKILL</text><text x="48" y="174" font-size="104" font-weight="500" fill="#10151c" font-family="IBM Plex Mono, sans-serif">ko-ste</text><text x="48" y="267" font-size="59" font-weight="500" fill="#10151c" font-family="IBM Plex Sans KR, sans-serif">뜻은 그대로.</text><text x="48" y="345" font-size="59" font-weight="500" fill="#10151c" font-family="IBM Plex Sans KR, sans-serif">읽기는 쉽게.</text><text x="48" y="415" font-size="26" font-weight="400" fill="#55606d" font-family="IBM Plex Sans KR, sans-serif">한국어를 다듬는 Agent Skill.</text><path d="M48 475L672 475" stroke="#e3e8ee" stroke-width="2" fill="none"/><text x="48" y="520" font-size="18" font-weight="400" fill="#55606d" font-family="IBM Plex Mono, sans-serif">01 / BEFORE</text><text x="48" y="579" font-size="34" font-weight="400" fill="#55606d" font-family="IBM Plex Sans KR, sans-serif">배포 수행이 필요합니다.</text><path d="M48 622L672 622" stroke="#e3e8ee" stroke-width="2" fill="none"/><text x="48" y="670" font-size="18" font-weight="400" fill="#55606d" font-family="IBM Plex Mono, sans-serif">02 / AFTER</text><text x="48" y="729" font-size="34" font-weight="500" fill="#10151c" font-family="IBM Plex Sans KR, sans-serif">배포가 필요합니다.</text><path d="M151 747L337 747" stroke="#22485c" stroke-width="4" fill="none"/><text x="48" y="792" font-size="25" font-weight="400" fill="#55606d" font-family="IBM Plex Sans KR, sans-serif">필요의 강도를 유지합니다.</text><path d="M48 839L672 839" stroke="#e3e8ee" stroke-width="2" fill="none"/><text x="48" y="889" font-size="18" font-weight="400" fill="#55606d" font-family="IBM Plex Mono, sans-serif">CLAUDE CODE + CODEX</text></svg>
