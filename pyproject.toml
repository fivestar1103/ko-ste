[project]
name = "ko-ste"
version = "0.1.1"
description = "Korean plain-language skill and reproducible evaluation tools"
requires-python = ">=3.11"
dependencies = ["kiwipiepy==0.24.0"]

[dependency-groups]
dev = ["pytest==8.3.5", "PyYAML==6.0.2"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-p no:cacheprovider"
