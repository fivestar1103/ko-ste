name: Verify skill and recorded evidence
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install uv==0.10.0
      - run: uv sync --locked
      - run: uv run python -m pytest -q
      - run: uv run python scripts/validate_artifacts.py
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Discover and install the GitHub skill layout
        run: |
          cd /tmp
          npx --yes skills@1.7.1 add "$GITHUB_WORKSPACE" --skill ko-ste --agent codex --yes --copy
          test -f .agents/skills/ko-ste/SKILL.md
      - run: uv run python calibration/scripts/report.py --check
      - run: uv run python calibration/scripts/fetch_corpus.py
      - run: uv run python calibration/scripts/measure.py --out calibration/cache/ci-measure
      - name: Compare reproduced corpus measurements
        run: |
          uv run python -c "import json; from pathlib import Path; assert json.loads(Path('calibration/data/measure.json').read_text()) == json.loads(Path('calibration/cache/ci-measure/measure.json').read_text())"
